name: CI and Deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check-deps
      - run: pnpm test

  browser:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_HTML_OPEN: never
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: レポートの保存先を設定
        run: printf 'PLAYWRIGHT_HTML_OUTPUT_DIR=%s/playwright-report\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 日本語フォントを設定
        run: bash .github/scripts/setup-browser-fonts.sh
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:standalone --reporter=line,html --output="$GITHUB_WORKSPACE/test-results"
      - run: pnpm test:vrt --output="$GITHUB_WORKSPACE/test-results"
      - name: ブラウザテストの失敗レポートを保存
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  update-vrt:
    name: Linux の VRT 基準画像を更新
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_HTML_OPEN: never
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: レポートの保存先を設定
        run: printf 'PLAYWRIGHT_HTML_OUTPUT_DIR=%s/playwright-report\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 日本語フォントを設定
        run: bash .github/scripts/setup-browser-fonts.sh
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: 基準画像を一式生成
        run: |
          rm -rf tests/screenshots/linux
          pnpm test:vrt:update --output="$GITHUB_WORKSPACE/test-results"
      - name: 更新なしで再比較
        run: pnpm test:vrt --output="$GITHUB_WORKSPACE/test-results"
      - name: 画像一式と生成元コミットを梱包
        run: |
          tar -czf vrt-baselines.tar.gz tests/screenshots/linux
          git rev-parse HEAD > source-commit.txt
      - name: レビュー用の基準画像を保存
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vrt-baselines-${{ github.sha }}
          path: |
            vrt-baselines.tar.gz
            source-commit.txt
          if-no-files-found: error
          retention-days: 7
      - name: 更新失敗のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vrt-update-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        run: pnpm --filter @playground/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
