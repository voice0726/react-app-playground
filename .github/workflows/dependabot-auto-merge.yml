name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  dev-dependencies:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dependabot-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
      - id: notes
        name: リリースノートの破壊的変更を検出する
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE 'breaking|deprecat|removed|drop(ped)? support|migrat'; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - name: 開発依存の patch/minor を必須チェック通過後に squash マージする
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && steps.notes.outputs.risky != 'true'
          && steps.metadata.outputs.dependency-type == 'direct:development'
        run: |
          gh pr checks "$PR_URL" --required --watch --fail-fast
          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
          pr=$(gh pr view "$PR_URL" --json mergedAt,mergedBy)
          test "$(jq -r '.mergedAt != null' <<< "$pr")" = true
          if [ "$(jq -r '.mergedBy.login' <<< "$pr")" != 'github-actions[bot]' ]; then
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "head_sha=$main_sha" -f per_page=100 --paginate)
          requests=$(jq -s --arg sha "$main_sha" '[.[].workflow_runs[]
            | select(.head_sha == $sha)
            | select(.event == "push"
              or (.event == "workflow_dispatch" and (.display_title | startswith("Deploy "))))
            | select(.status != "completed" or .conclusion == "success")] | length' <<< "$runs")
          if [ "$requests" -eq 0 ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f task=deploy
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
