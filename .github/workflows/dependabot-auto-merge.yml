name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  dev-dependencies:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    concurrency:
      group: dependabot-merge-dev-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
      - id: notes
        name: リリースノートの破壊的変更を検出する
        run: |
          if printf '%s' "$PR_BODY" | sed '/<summary>Commits<\/summary>/,$d' \
            | grep -iE 'breaking|deprecat|drop(ped)? support' > /dev/null; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - id: merge
        name: 開発依存の patch/minor を必須チェック通過後に squash マージする
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch'
          || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && steps.notes.outputs.risky != 'true'
          && steps.metadata.outputs.dependency-type == 'direct:development'
        run: |
          gh pr checks "$PR_URL" --required --watch --fail-fast
          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
          echo 'merged=true' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  request-deploy:
    needs: [dev-dependencies]
    if: needs.dev-dependencies.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependabot-deploy-request
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: マージ後のデプロイ要求を直列化する
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(jq -r '.merged_at != null' <<< "$pr")" = true
          if [ "$(jq -r '.merged_by.login' <<< "$pr")" != 'github-actions[bot]' ]; then
            exit 0
          fi
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          for attempt in {1..30}; do
            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f "head_sha=$main_sha" -f per_page=100 --paginate)
            requests=$(jq -s --arg sha "$main_sha" '[.[].workflow_runs[]
              | select(.head_sha == $sha)
              | select(.event == "push"
                or (.event == "workflow_dispatch" and (.display_title | startswith("Deploy "))))
              | select(.status != "completed" or .conclusion == "success")] | length' <<< "$runs")
            if [ "$requests" -gt 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f task=deploy
            fi
            sleep 2
          done
          echo 'Deployment request did not become visible' >&2
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
